<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kế hoạch doanh thu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
    <div class="page">

        <header class="page-header">
            <div class="logo-slot" id="logoSlot">
                <img src="images/logov1.png" alt="Logo công ty"
                     onload="document.getElementById('logoSlot').classList.add('has-logo')"
                     onerror="this.style.display='none'" />
            </div>

            <div class="title-block">
                <h1 id="pageTitle">Kế hoạch doanh thu</h1>
                <p class="subtitle" id="pageSubtitle">Toàn hệ thống</p>
            </div>

            <div class="clock-block">
                <div id="clock" class="clock">--:--:--</div>
                <div id="updatedAt" class="updated-at">Đang tải dữ liệu…</div>
            </div>
        </header>

        <nav class="view-tabs" id="viewTabs" aria-label="Chọn khoảng thời gian">
            <button class="view-tab active" data-view="year">Năm</button>
            <button class="view-tab" data-view="q1">Q1</button>
            <button class="view-tab" data-view="q2">Q2</button>
            <button class="view-tab" data-view="q3">Q3</button>
            <button class="view-tab" data-view="q4">Q4</button>
        </nav>

        <section id="heroSection" class="hero" aria-label="Tổng toàn hệ thống">
            <div class="hero-loading" id="heroLoading">Đang tải dữ liệu…</div>
        </section>

        <section class="branches" aria-label="Chi tiết theo chi nhánh">
            <div id="branchGrid" class="branch-grid"></div>
        </section>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
