<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KẾ HOẠCH DOANH THU</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="rotate-bar"><div class="rotate-bar-fill" id="rotateBarFill"></div></div>

  <div class="page">
    <header class="page-header">
      <div class="logo-slot has-logo" id="logoSlot"><img src="images/logov1.png" alt="POSTEF" /></div>
      <div class="title-block" id="titleBlock">
        <h1 id="pageTitle">KẾ HOẠCH DOANH THU</h1>
        <p class="subtitle" id="pageSubtitle"></p>
      </div>
      <div class="clock-block">
        <div class="clock" id="clock">--:--:--</div>
        <div class="updated-at" id="updatedAt"></div>
      </div>
    </header>

    <div class="toolbar">
      <nav class="screen-tabs" id="screenTabs">
        <button class="screen-tab active" data-screen="revenue">Doanh thu</button>
        <button class="screen-tab" data-screen="output">Sản lượng</button>
      </nav>
      <nav class="view-tabs" id="viewTabs">
        <button class="view-tab active" data-view="year">Năm</button>
        <button class="view-tab" data-view="q1">Q1</button>
        <button class="view-tab" data-view="q2">Q2</button>
        <button class="view-tab" data-view="q3">Q3</button>
        <button class="view-tab" data-view="q4">Q4</button>
      </nav>
    </div>

    <main class="stage">
      <!-- Màn Doanh thu -->
      <section class="screen is-active" id="screenRevenue">
        <section class="top-row">
          <div class="hero"></div>
          <aside class="accounting-panel"></aside>
        </section>
        <section class="branches"><div class="branch-grid"></div></section>
      </section>

      <!-- Màn Sản lượng -->
      <section class="screen" id="screenOutput">
        <section class="top-row single">
          <div class="hero"></div>
        </section>
        <section class="branches"><div class="branch-grid"></div></section>
      </section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
